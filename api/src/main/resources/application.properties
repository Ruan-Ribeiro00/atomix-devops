# ===================== ATOMIX API =====================
spring.application.name=atomix-api
server.port=${SERVER_PORT:8080}

# ---------- Oracle ----------
# Credenciais SOMENTE por variáveis de ambiente (nunca versionar usuário/senha).
# Padrão: o Oracle do docker-compose deste repositório (localhost:1521/FREEPDB1, usuário ATOMIX).
# No Oracle da FIAP: DB_URL=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL  DB_USER=rmXXXXXX  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:ATOMIX}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas, sequences, procedures e functions vêm do projeto de Banco de Dados
# (database/sql/01_ddl.sql e 02_plsql.sql). O Hibernate não cria nem altera nada.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Mostra no log cada procedure chamada e o ORA-200xx devolvido (útil no vídeo de Banco de Dados).
# Para ver também o comando enviado ao Oracle ({call PRC_ATX_...(?,?,...)}), rode com
#   --logging.level.org.hibernate.SQL=DEBUG
logging.level.br.com.fiap.atomix.database=INFO
# Os erros de negócio das procedures (RAISE_APPLICATION_ERROR) já são registrados acima e viram 4xx;
# erros inesperados aparecem no log do GlobalExceptionHandler com o stack trace.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# ---------- Erros: nunca expor stack trace ----------
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ---------- CORS (app Flutter) ----------
atomix.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
